# /etc/nginx/sites-available/darslik-bot  →  ln -s ../sites-available/darslik-bot /etc/nginx/sites-enabled/
# "bot.example.uz" ni o'z domeningizga almashtiring. Sertifikat: certbot (deploy/DEPLOY.md, 3-qadam).

# IP bo'yicha limitlar (ilova ichida ham limitlar bor — bu birinchi himoya qatlami)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=golink:10m rate=10r/s;
limit_req_status 429;

log_format darslik_json escape=json
  '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time",'
  '"req_id":"$request_id","ua":"$http_user_agent"}';

upstream darslik_app {
  server 127.0.0.1:8080;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name bot.example.uz;
  # certbot (HTTP-01) uchun
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  # "listen ... http2" — Ubuntu 24.04 apt dagi nginx 1.24 ham tushunadi ("http2 on;" faqat 1.25.1+).
  # Yangi nginx'da faqat "deprecated" ogohlantirishi beradi, ishlashiga ta'sir qilmaydi
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name bot.example.uz;

  ssl_certificate     /etc/letsencrypt/live/bot.example.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bot.example.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Xavfsizlik sarlavhalarini (HSTS, CSP, nosniff, frame) ilova — helmet qo'yadi; bu yerda takrorlanmaydi
  server_tokens off;

  access_log /var/log/nginx/darslik-bot.access.log darslik_json;
  error_log  /var/log/nginx/darslik-bot.error.log warn;

  # Umumiy: kichik body, qisqa timeoutlar (sekin/yarim so'rov bilan ulanishni band qilish — slowloris)
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  # Bitta proksi: mijoz yuborgan X-Forwarded-For e'tiborsiz — soxtalashtirib bo'lmaydi (ilovada trust proxy = 1)
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  # Telegram webhook — faqat Telegram serverlaridan (core.telegram.org/bots/webhooks); secret token ilovada tekshiriladi
  location = /telegram/webhook {
    allow 149.154.160.0/20;
    allow 91.108.4.0/22;
    deny all;
    client_max_body_size 1m;
    proxy_read_timeout 15s;
    proxy_pass http://darslik_app;
  }

  # Prometheus metrikalari — faqat serverning o'zidan (scrape localhost:8080 orqali)
  location = /metrics { deny all; }

  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://darslik_app;
  }

  # Panel: broadcast media va mahsulot videosi (50 MB gacha, sekin internetda yuklash uzoq)
  location ~ ^/api/(broadcast|products/\d+/video)$ {
    limit_req zone=api burst=10 nodelay;
    client_max_body_size 55m;
    client_body_timeout 120s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering on;
    proxy_pass http://darslik_app;
  }

  # Payme / Click to'lov tizimlari: panel limitidan alohida (to'lov serverlari bir nechta IP dan ko'p so'rov yuboradi).
  # Autentifikatsiya ilovada: Payme — Basic auth, Click — MD5 imzo
  location /api/payments/ {
    client_max_body_size 64k;
    proxy_pass http://darslik_app;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://darslik_app;
  }

  # Reklama tracking linklari
  location /l/ {
    limit_req zone=golink burst=20 nodelay;
    proxy_pass http://darslik_app;
  }

  # Admin panel statik fayllari (ilova keshlash sarlavhalarini o'zi qo'yadi)
  location / {
    proxy_pass http://darslik_app;
  }
}
