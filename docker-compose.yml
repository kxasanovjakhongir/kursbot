services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bot:${POSTGRES_PASSWORD:-bot}@db:5432/darslik_bot
      REDIS_URL: redis://redis:6379
      BOT_MODE: webhook
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: darslik_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d darslik_bot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # 2-bosqich: BullMQ (eslatmalar, SLA taymerlari, ommaviy xabar)
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
